name: test

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive examples
      - name: Check generated GraphQL and Registry docs
        run: |
          go generate ./...
          git diff --exit-code
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

  vet-platforms:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
